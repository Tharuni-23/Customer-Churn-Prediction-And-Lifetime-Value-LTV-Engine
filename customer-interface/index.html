<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TelcoConnect - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <div class="center">

        <div class="login-card">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="login-brand">
                TELCOCONNECT
            </div>


            <!-- =================================================
                 HEADING
            ================================================== -->

            <h1>
                Welcome Back
            </h1>


            <p class="sub">
                Sign in to manage your account and subscription.
            </p>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div
                    class="field"
                    style="margin-top:14px"
                >

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN OPTIONS -->

                <div class="actions">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    class="btn btn-primary"
                    type="submit"
                    style="width:100%"
                >
                    Login
                </button>


                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="muted"
                    style="margin-top:12px"
                ></div>

            </form>


            <!-- =================================================
                 REGISTER LINK
            ================================================== -->

            <div
                style="
                    text-align:center;
                    margin-top:18px;
                    font-size:12px;
                    color:var(--muted);
                "
            >

                Don't have an account?

                <a
                    href="register.html"
                    style="
                        color:var(--blue);
                        font-weight:700;
                    "
                >
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script src="login.js"></script>

</body>

</html>
