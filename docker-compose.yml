version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: churn-ltv-api
    command: uvicorn backend.test_api_single_customer:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: churn-ltv-scheduler
    command: python -m pipeline.scheduler
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: churn-ltv-frontend
    ports:
      - "5500:80"
    restart: unless-stopped