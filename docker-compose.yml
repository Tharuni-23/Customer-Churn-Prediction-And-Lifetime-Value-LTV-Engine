services:

  churn-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-ltv-pipeline
    env_file:
      - .env
    restart: unless-stopped
    command: python main.py

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-ltv-scheduler
    env_file:
      - .env
    restart: unless-stopped
    command: python scheduler.py

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-ltv-api
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn test_api_single_customer:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: churn-ltv-frontend
    restart: unless-stopped
    ports:
      - "5500:80"